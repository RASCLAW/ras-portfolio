<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Pipeline + CRM Simulator -- RAS AI Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050508;--card:#0c0c14;--border:#1a1a2e;--text:#e2e8f0;--muted:#64748b;--accent:#22d3ee;--accent2:#a78bfa;--pink:#f472b6;--green:#10b981;--amber:#f59e0b;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
.m{font-family:'JetBrains Mono',monospace}

.sim{max-width:800px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}
.header{text-align:center;padding:40px 0 12px}
.header .tag{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--accent);margin-bottom:8px}
.header h1{font-size:22px;font-weight:700;letter-spacing:-1px}
.header p{font-size:13px;color:var(--muted);margin-top:8px}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 60px}
.scene{width:100%;max-width:650px;min-height:380px;position:relative}

/* PHASE LABEL */
.phase-label{text-align:center;margin:12px 0 8px;font-size:10px;text-transform:uppercase;letter-spacing:3px;font-weight:600}

/* CONVEYOR */
.conveyor{display:flex;align-items:center;gap:6px;padding:8px 0;justify-content:center;flex-wrap:wrap}
.conveyor-item{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid var(--border);transition:all .4s;opacity:.3}
.conveyor-item.active{opacity:1;border-color:var(--accent);box-shadow:0 0 15px rgba(34,211,238,.2)}
.conveyor-item.done{opacity:1;border-color:var(--green)}
.conveyor-arrow{color:var(--muted);font-size:12px;opacity:.3}

/* AGENT */
.agent{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.agent-body{width:72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;transition:transform .3s}
.agent-body.thinking{animation:think 1s ease-in-out infinite}
.agent-body.working{animation:work .5s ease-in-out infinite}
.agent-body.celebrating{animation:celebrate .4s ease-in-out 3}
.agent-name{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.agent-status{font-size:10px;color:var(--muted);min-height:14px}

.thought{position:absolute;top:-50px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:11px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.thought.visible{opacity:1}
.thought::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid var(--border)}

.workspace{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:16px;width:100%;min-height:120px;overflow:hidden}
.workspace-label{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:10px}

.paper{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:8px;padding:10px 14px;margin-bottom:6px;font-size:11px;line-height:1.5;opacity:0;transform:translateY(8px);transition:all .4s}
.paper.visible{opacity:1;transform:translateY(0)}
.paper .label{font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}

.btn{padding:10px 20px;border:none;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(34,211,238,.3)}
.btn-secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:20px}

.img-gen{width:160px;height:200px;border-radius:12px;background:var(--card);border:2px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:12px auto;position:relative;overflow:hidden}
.img-gen .progress{position:absolute;bottom:0;left:0;height:3px;background:var(--accent);transition:width 2s linear}
.img-gen.generating{border-color:var(--amber);animation:pulse 1.5s ease-in-out infinite}
.img-gen.done{border-color:var(--green)}

/* CRM SPECIFIC */
.customer{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:12px}
.customer .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:rgba(167,139,250,.1)}

.chat-bubble{max-width:80%;padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.5;margin-bottom:8px;opacity:0;transform:translateY(8px);transition:all .4s}
.chat-bubble.visible{opacity:1;transform:translateY(0)}
.chat-bubble.customer-msg{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.2);margin-left:auto;border-bottom-right-radius:4px}
.chat-bubble.bot-msg{background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.2);margin-right:auto;border-bottom-left-radius:4px}

.lead-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin:12px auto;max-width:350px}
.lead-card .field{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:11px}
.lead-card .field:last-child{border:none}
.lead-card .field .k{color:var(--muted)}
.lead-card .field .v{font-weight:600}
.lead-tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px}

.notification{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin:8px 0;display:flex;align-items:center;gap:10px;font-size:12px;opacity:0;transform:translateX(-20px);transition:all .4s}
.notification.visible{opacity:1;transform:translateX(0)}
.notification .icon{font-size:18px}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:16px 0}
.metric{text-align:center;padding:12px;background:#1a1a2e;border-radius:8px}
.metric .num{font-size:18px;font-weight:700}
.metric .label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}

@keyframes think{0%,100%{transform:scale(1)}50%{transform:scale(1.05) rotate(2deg)}}
@keyframes work{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes celebrate{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.1) rotate(-5deg)}75%{transform:scale(1.1) rotate(5deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 15px rgba(245,158,11,.3)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
.animate-in{animation:fadeUp .5s ease forwards}

.log{position:fixed;bottom:0;left:0;right:0;background:rgba(5,5,8,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:6px 16px;display:flex;align-items:center;gap:10px;font-size:10px;z-index:100}
.log .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.log .msg{color:var(--muted);flex:1}
.log .time{color:var(--muted);font-size:9px}

.final{text-align:center;padding:32px 16px}
.final h2{font-size:26px;font-weight:700;margin-bottom:12px}
.final p{color:var(--muted);font-size:13px;line-height:1.7;max-width:500px;margin:0 auto 20px}

@media(max-width:600px){.conveyor-item{width:32px;height:32px;font-size:14px}}
</style>
</head>
<body>

<div class="sim">
  <div class="header">
    <div class="tag m">Interactive Simulation</div>
    <h1>Full Funnel Orchestrator</h1>
    <p>You are Claude Code. Run the content pipeline, then watch the customer journey unfold.</p>
  </div>

  <!-- PHASE 1: CONTENT -->
  <div class="phase-label m" style="color:var(--accent)">Phase 1: Content Pipeline</div>
  <div class="conveyor" id="conveyor1">
    <div class="conveyor-item active" id="cv-0">💡</div>
    <div class="conveyor-arrow">&rarr;</div>
    <div class="conveyor-item" id="cv-1">📝</div>
    <div class="conveyor-arrow">&rarr;</div>
    <div class="conveyor-item" id="cv-2">🎨</div>
    <div class="conveyor-arrow">&rarr;</div>
    <div class="conveyor-item" id="cv-3">📸</div>
    <div class="conveyor-arrow">&rarr;</div>
    <div class="conveyor-item" id="cv-4">👁</div>
    <div class="conveyor-arrow">&rarr;</div>
    <div class="conveyor-item" id="cv-5">📣</div>
  </div>

  <!-- PHASE 2: CRM -->
  <div class="phase-label m" style="color:var(--accent2)" id="phase2-label" hidden>Phase 2: Customer Journey</div>
  <div class="conveyor" id="conveyor2" hidden>
    <div class="conveyor-item" id="cv-6">👀</div>
    <div class="conveyor-arrow">&rarr;</div>
    <div class="conveyor-item" id="cv-7">🛬</div>
    <div class="conveyor-arrow">&rarr;</div>
    <div class="conveyor-item" id="cv-8">💬</div>
    <div class="conveyor-arrow">&rarr;</div>
    <div class="conveyor-item" id="cv-9">📋</div>
    <div class="conveyor-arrow">&rarr;</div>
    <div class="conveyor-item" id="cv-10">🤖</div>
    <div class="conveyor-arrow">&rarr;</div>
    <div class="conveyor-item" id="cv-11">📦</div>
  </div>

  <div class="stage">
    <div class="scene" id="scene"></div>
  </div>
</div>

<div class="log">
  <div class="dot" style="background:var(--green);box-shadow:0 0 6px var(--green)" id="log-dot"></div>
  <div class="msg m" id="log-msg">System ready. Awaiting your command, Orchestrator.</div>
  <div class="time m" id="log-time"></div>
</div>

<script>
const scene=document.getElementById('scene');
const logMsg=document.getElementById('log-msg');
const logTime=document.getElementById('log-time');
const logDot=document.getElementById('log-dot');

const captions=[
  {id:'20260324-001',angle:'Identity',hook:'POV',caption:"POV: You walked into the office and everyone asked where you got your shades.\n\nDubery Outback. P699 lang.\nBundle 2 pairs for P1,200.\n\nCOD Metro Manila. Same-day delivery.\n\nMessage us na."},
  {id:'20260324-002',angle:'Pain Relief',hook:'Question',caption:"Napapagod ka na ba sa sunglasses na nababasag after 2 weeks?\n\nDubery Bandits Series. Polarized. Built different.\nP699 single. P1,200 bundle."},
  {id:'20260324-003',angle:'Value/Deal',hook:'Price Shock',caption:"P1,200 for TWO pairs of polarized sunglasses.\n\nThat's P600 each. Cheaper than your Grab ride.\n\nDubery Rasta Series. COD Metro Manila."}
];

function log(msg,color){
  logMsg.textContent=msg;
  logDot.style.background=color||'var(--green)';
  logDot.style.boxShadow=`0 0 6px ${color||'var(--green)'}`;
  const now=new Date();
  logTime.textContent=now.toLocaleTimeString('en-US',{hour12:false});
}

function setCV(idx){for(let i=0;i<12;i++){const el=document.getElementById('cv-'+i);if(el)el.className='conveyor-item'+(i<idx?' done':i===idx?' active':'')}}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}

// ========== PHASE 1: CONTENT PIPELINE ==========

function showIntro(){
  setCV(0);
  scene.innerHTML=`
    <div class="animate-in" style="text-align:center;padding:30px 0">
      <div class="agent">
        <div class="agent-body" style="background:rgba(34,211,238,.1);width:90px;height:90px;font-size:44px;border-radius:22px">🤖</div>
        <div class="agent-name" style="color:var(--accent);font-size:13px;margin-top:10px">You are the Orchestrator</div>
        <div class="agent-status" style="max-width:420px;margin-top:8px;line-height:1.6;font-size:12px">Command AI agents to create content, generate ads, then watch customers flow through your CRM. The full funnel.</div>
      </div>
      <div class="btn-row"><button class="btn btn-primary" onclick="step1()">Start Pipeline &rarr;</button></div>
    </div>`;
}

async function step1(){
  setCV(1);log('Deploying Caption Agent...','var(--accent2)');
  scene.innerHTML=`
    <div style="display:flex;gap:24px;align-items:flex-start">
      <div class="agent" style="flex-shrink:0">
        <div class="thought" id="t1">What angle works here...</div>
        <div class="agent-body thinking" id="a1" style="background:rgba(167,139,250,.1)">📝</div>
        <div class="agent-name" style="color:var(--accent2)">Caption Agent</div>
        <div class="agent-status" id="s1">Calibrating...</div>
      </div>
      <div class="workspace" style="flex:1"><div class="workspace-label m">Captions</div><div id="out1"></div></div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" id="btn1" disabled onclick="step2()">Approve &rarr;</button><button class="btn btn-secondary" id="btn1r" disabled onclick="regenCaption()">Regenerate</button></div>`;
  await wait(500);document.getElementById('t1').classList.add('visible');
  await wait(1000);document.getElementById('s1').textContent='Writing captions...';document.getElementById('a1').className='agent-body working';
  const out=document.getElementById('out1');
  for(let i=0;i<3;i++){
    await wait(1000);
    const p=document.createElement('div');p.className='paper';
    p.innerHTML=`<div class="label">#${captions[i].id} // ${captions[i].angle} x ${captions[i].hook}</div><div style="color:var(--muted)">${captions[i].caption.substring(0,100)}...</div>`;
    out.appendChild(p);await wait(80);p.classList.add('visible');
    log(`Caption ${i+1}/3: ${captions[i].angle} x ${captions[i].hook}`,'var(--accent2)');
  }
  await wait(500);document.getElementById('a1').className='agent-body celebrating';document.getElementById('t1').textContent='3 captions validated!';
  document.getElementById('btn1').disabled=false;document.getElementById('btn1r').disabled=false;log('3 captions ready. Approve or regenerate.','var(--green)');
}

async function regenCaption(){
  log('Caption REJECTED. Agent regenerating with new angle...','var(--amber)');
  const out=document.getElementById('out1');
  out.innerHTML='';
  document.getElementById('btn1').disabled=true;
  document.getElementById('a1').className='agent-body thinking';
  document.getElementById('t1').textContent='Rejected combo noted. Trying new angle...';
  document.getElementById('s1').textContent='Recalibrating...';
  await wait(1000);
  document.getElementById('a1').className='agent-body working';
  document.getElementById('s1').textContent='Rewriting captions...';
  document.getElementById('t1').textContent='Status/Glow Up + Flex hook. Fresh take.';
  const alts=[
    {id:'20260324-004',angle:'Status/Glow Up',hook:'Flex',caption:"Yung tipong P699 lang pero akala nila designer.\n\nDubery Outback. Polarized. Hindi plastik.\nBundle 2 for P1,200."},
    {id:'20260324-005',angle:'Convenience',hook:'Speed',caption:"Order now, delivered today.\n\nDubery Bandits Series. P699.\nCOD Metro Manila. Walang hassle."},
    {id:'20260324-006',angle:'Lifestyle',hook:'Identity',caption:"Hindi ka naman celebrity pero bakit ang daming nag-aask ng shades mo?\n\nDubery Rasta. P699. Bundle P1,200."}
  ];
  for(let i=0;i<3;i++){
    await wait(1000);
    const p=document.createElement('div');p.className='paper';
    p.innerHTML=`<div class="label">#${alts[i].id} // ${alts[i].angle} x ${alts[i].hook}</div><div style="color:var(--muted)">${alts[i].caption.substring(0,100)}...</div>`;
    out.appendChild(p);await wait(80);p.classList.add('visible');
    log(`Regen caption ${i+1}/3: ${alts[i].angle} x ${alts[i].hook}`,'var(--accent2)');
  }
  await wait(500);document.getElementById('a1').className='agent-body celebrating';document.getElementById('t1').textContent='Fresh batch ready!';
  document.getElementById('btn1').disabled=false;log('3 new captions ready. Approve or regenerate again.','var(--green)');
}

async function step2(){
  setCV(2);log('Deploying Prompt Writer...','var(--pink)');
  scene.innerHTML=`
    <div style="display:flex;gap:24px;align-items:flex-start">
      <div class="agent" style="flex-shrink:0">
        <div class="thought visible">Outback Black... rooftop scene...</div>
        <div class="agent-body working" style="background:rgba(244,114,182,.1)">🎨</div>
        <div class="agent-name" style="color:var(--pink)">Prompt Writer</div>
        <div class="agent-status" id="s2">Crafting prompt...</div>
      </div>
      <div class="workspace" style="flex:1"><div class="workspace-label m">Structured Prompt</div><div id="out2"></div></div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" id="btn2" disabled onclick="step3()">Generate Image &rarr;</button></div>`;
  const fields=[['Headline','DUBERY OUTBACK'],['Scene','Golden hour rooftop, Manila skyline, warm amber light'],['Render Notes','Centered hero, 85mm, golden hour rim light'],['Validator','PASS -- product fidelity OK, no violations']];
  const out=document.getElementById('out2');
  for(const[l,v]of fields){
    await wait(800);const p=document.createElement('div');p.className='paper';
    p.innerHTML=`<div class="label"${l==='Validator'?' style="color:var(--green)"':''}>${l}</div><div style="color:var(--muted)">${v}</div>`;
    out.appendChild(p);await wait(80);p.classList.add('visible');log(`Prompt: ${l}`,'var(--pink)');
  }
  await wait(400);document.getElementById('btn2').disabled=false;log('Prompt validated. Ready for image gen.','var(--green)');
}

async function step3(){
  setCV(3);log('Connecting to kie.ai Nano Banana 2...','var(--amber)');
  scene.innerHTML=`
    <div style="text-align:center">
      <div class="agent"><div class="thought visible">Rendering at 2K...</div><div class="agent-body working" style="background:rgba(245,158,11,.1)">📸</div>
        <div class="agent-name" style="color:var(--amber)">Image Generator</div><div class="agent-status" id="s3">Sending to API...</div></div>
      <div class="img-gen generating" id="imgbox"><div style="font-size:40px;opacity:.3">🖼</div><div style="font-size:10px;color:var(--muted)" id="imgst">Generating...</div><div class="progress" id="imgpr" style="width:0%"></div></div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" id="btn3" disabled onclick="step4()">Review &rarr;</button></div>`;
  await wait(1000);document.getElementById('imgpr').style.width='40%';document.getElementById('s3').textContent='Rendering...';
  await wait(2000);document.getElementById('imgpr').style.width='80%';
  await wait(1500);document.getElementById('imgpr').style.width='100%';document.getElementById('imgbox').className='img-gen done';
  document.getElementById('imgst').textContent='Done';document.getElementById('imgst').style.color='var(--green)';
  document.getElementById('btn3').disabled=false;log('Image generated. Backed up to Drive.','var(--green)');
}

async function step4(){
  setCV(4);log('Your decision, Orchestrator.','var(--accent)');
  scene.innerHTML=`
    <div style="text-align:center" class="animate-in">
      <div style="font-size:13px;font-weight:600;margin-bottom:12px">Review Image</div>
      <div style="font-size:48px;margin:16px">🖼</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:16px">Dubery Outback // Golden Hour Rooftop // 928x1152px</div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="step5()">Approve ✓</button>
        <button class="btn btn-secondary" onclick="rejectImg()">Reject</button>
      </div>
    </div>`;
}

async function rejectImg(){
  log('REJECTED. Agent regenerating with adjusted parameters...','var(--amber)');
  scene.innerHTML=`<div style="text-align:center;padding:30px" class="animate-in">
    <div class="agent-body working" style="background:rgba(245,158,11,.1);font-size:36px;margin:0 auto">📸</div>
    <div style="margin-top:12px;font-size:12px;color:var(--muted)">Regenerating with feedback...</div>
    <div style="margin-top:6px;font-size:11px;color:var(--accent)">Autonomous retry -- the agentic advantage.</div></div>`;
  await wait(2500);step4();
}

async function step5(){
  setCV(5);log('Staging ad on Meta...','var(--accent)');
  scene.innerHTML=`
    <div style="text-align:center" class="animate-in">
      <div class="agent"><div class="thought visible">Uploading to Meta Ads API...</div>
        <div class="agent-body working" style="background:rgba(34,211,238,.1)">📣</div>
        <div class="agent-name" style="color:var(--accent)">Ad Staging Agent</div><div class="agent-status" id="s5">Connecting...</div></div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;max-width:280px;margin:16px auto;opacity:0;transition:opacity .5s" id="adprev">
        <div style="height:140px;background:#1a1a2e;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:10px">🖼</div>
        <div style="font-size:11px;line-height:1.5;margin-bottom:6px">POV: You walked into the office and everyone asked where you got your shades...</div>
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted)"><span>DuberyMNL</span><span style="color:var(--green)">STAGED</span></div>
      </div>
    </div>`;
  await wait(1500);document.getElementById('s5').textContent='Creative uploaded...';
  await wait(1000);document.getElementById('adprev').style.opacity='1';
  await wait(1000);log('Ad staged on Meta (PAUSED). Content pipeline complete!','var(--green)');
  await wait(1500);
  // TRANSITION TO PHASE 2
  showPhase2Intro();
}

// ========== PHASE 2: CUSTOMER JOURNEY ==========

async function showPhase2Intro(){
  document.getElementById('phase2-label').hidden=false;
  document.getElementById('conveyor2').hidden=false;
  setCV(6);
  scene.innerHTML=`
    <div class="animate-in" style="text-align:center;padding:20px 0">
